<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Home">

<title>Home Assistant</title>


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101010;
    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;
}

button {
    font-family: inherit;
}


/* =========================================================
   APP
   ========================================================= */

#app {

    width: 100%;
    height: 100%;

    overflow: hidden;
}


/* =========================================================
   PAGE SYSTEM
   ========================================================= */

#pages {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    width: 400%;
    height: 100%;

    -webkit-transform: translateX(0);
    transform: translateX(0);

    -webkit-transition: -webkit-transform 0.35s ease;
    transition: transform 0.35s ease;
}


.page {

    width: 25%;
    height: 100%;

    -webkit-flex-shrink: 0;
    flex-shrink: 0;

    padding:
        35px
        25px
        90px
        25px;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
}


.page-content {

    width: 100%;
    max-width: 600px;

    margin: 0 auto;
}


/* =========================================================
   HOME
   ========================================================= */

#home {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    -webkit-align-items: center;
    align-items: center;

    -webkit-justify-content: center;
    justify-content: center;

    text-align: center;
}


.home-inner {
    width: 100%;
}


.time {

    font-size: 68px;

    line-height: 1;

    font-weight: 300;

    letter-spacing: -3px;
}


.date {

    margin-top: 15px;

    font-size: 20px;

    color: #999999;
}


.greeting {

    margin-top: 45px;

    font-size: 27px;

    font-weight: 400;
}


.home-weather {

    margin-top: 25px;

    font-size: 19px;

    color: #aaaaaa;
}


/* =========================================================
   GENERAL
   ========================================================= */

.page-title {

    font-size: 36px;

    font-weight: 400;

    margin-bottom: 25px;
}


.card {

    background: #1b1b1b;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 15px;
}


.large-number {

    font-size: 54px;

    font-weight: 300;
}


.secondary {

    color: #999999;

    font-size: 17px;
}


.divider {

    height: 1px;

    background: #2c2c2c;

    margin: 18px 0;
}


/* =========================================================
   WEATHER
   ========================================================= */

.weather-main {

    text-align: center;

    padding:
        25px
        0;
}


.weather-temp {

    font-size: 70px;

    font-weight: 300;
}


.weather-condition {

    font-size: 24px;

    margin-top: 8px;
}


.weather-feels {

    color: #999999;

    margin-top: 8px;
}


.weather-grid {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    margin-left: -5px;
    margin-right: -5px;
}


.weather-stat {

    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;

    background: #1b1b1b;

    border-radius: 15px;

    padding:
        18px
        10px;

    margin:
        0
        5px;

    text-align: center;
}


.stat-label {

    color: #888888;

    font-size: 14px;

    margin-bottom: 8px;
}


.stat-value {

    font-size: 20px;
}


/* =========================================================
   HOURLY WEATHER
   ========================================================= */

.hour-row {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    overflow-x: auto;

    padding-bottom: 5px;

    -webkit-overflow-scrolling: touch;
}


.hour {

    -webkit-flex-shrink: 0;
    flex-shrink: 0;

    width: 80px;

    background: #1b1b1b;

    border-radius: 14px;

    padding:
        14px
        8px;

    margin-right: 10px;

    text-align: center;
}


.hour-time {

    color: #888888;

    font-size: 13px;
}


.hour-temp {

    font-size: 21px;

    margin:
        8px
        0;
}


.hour-rain {

    color: #777777;

    font-size: 12px;
}


/* =========================================================
   CALCULATOR
   ========================================================= */

.calculator {

    width: 100%;

    max-width: 400px;

    margin: 0 auto;
}


.calc-display {

    width: 100%;

    height: 85px;

    background: #181818;

    border-radius: 15px;

    margin-bottom: 12px;

    padding: 15px;

    text-align: right;

    font-size: 40px;

    line-height: 55px;

    overflow: hidden;

    white-space: nowrap;
}


/*
   IMPORTANT:
   iOS 9 Safari does not support CSS Grid.

   The calculator therefore uses flexbox.
*/

.calc-buttons {

    width: 100%;

    overflow: hidden;
}


.calc-row {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    width: 100%;

    margin-bottom: 9px;
}


.calc-button {

    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;

    height: 65px;

    min-width: 0;

    border: none;

    border-radius: 14px;

    background: #242424;

    color: white;

    font-size: 24px;

    margin-right: 9px;

    outline: none;
}


.calc-button:last-child {
    margin-right: 0;
}


.calc-button:active {

    background: #3a3a3a;

    -webkit-transform: scale(0.97);
    transform: scale(0.97);
}


.calc-button.operator {

    background: #303030;
}


.calc-button.equals {

    background: #ffffff;

    color: #111111;
}


.calc-button.clear {

    background: #333333;
}


/* =========================================================
   ASSISTANT
   ========================================================= */

.assistant {

    text-align: center;

    margin-top: 80px;
}


.assistant-circle {

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: #1c1c1c;

    margin:
        0
        auto
        30px
        auto;

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    -webkit-align-items: center;
    align-items: center;

    -webkit-justify-content: center;
    justify-content: center;

    font-size: 18px;

    color: #888888;
}


.assistant-text {

    font-size: 25px;
}


.assistant-sub {

    margin-top: 12px;

    color: #777777;

    font-size: 16px;
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

#navigation {

    position: fixed;

    bottom: 15px;

    left: 50%;

    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    max-width: calc(100% - 30px);

    padding: 6px;

    background: #191919;

    border-radius: 14px;

    z-index: 10;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}


.nav-button {

    -webkit-flex-shrink: 0;
    flex-shrink: 0;

    border: none;

    background: transparent;

    color: #777777;

    padding:
        9px
        13px;

    border-radius: 10px;

    outline: none;

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    -webkit-align-items: center;
    align-items: center;

    font-size: 14px;

    white-space: nowrap;
}


.nav-button:active {

    -webkit-transform: scale(0.96);
    transform: scale(0.96);
}


.nav-button.active {

    background: #ffffff;

    color: #111111;
}


.nav-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: currentColor;

    margin-right: 7px;
}


.nav-label {
    display: inline-block;
}


/* =========================================================
   SMALL SCREEN
   ========================================================= */

@media (max-width: 500px) {

    .time {
        font-size: 55px;
    }


    .greeting {
        font-size: 23px;
    }


    .page-title {
        font-size: 30px;
    }


    .weather-temp {
        font-size: 60px;
    }


    .page {
        padding-left: 18px;
        padding-right: 18px;
    }


    .calc-button {
        height: 60px;
        font-size: 22px;
    }

}

</style>

</head>

<script>

/* =========================================================
   PAGE NAVIGATION
   ========================================================= */

var currentPage = 0;

var totalPages = 4;

var pages =
    document.getElementById("pages");

var navigationButtons =
    document.getElementsByClassName("nav-button");

var touchStartX = 0;

var touchStartY = 0;


/* =========================================================
   GO TO PAGE
   ========================================================= */

function goToPage(page) {

    if (page < 0) {
        page = 0;
    }

    if (page >= totalPages) {
        page = totalPages - 1;
    }

    currentPage = page;

    updatePage();
}


/* =========================================================
   UPDATE PAGE
   ========================================================= */

function updatePage() {

    pages.style.webkitTransform =
        "translateX(-" +
        (currentPage * 25) +
        "%)";

    pages.style.transform =
        "translateX(-" +
        (currentPage * 25) +
        "%)";


    var i;

    for (
        i = 0;
        i < navigationButtons.length;
        i++
    ) {

        navigationButtons[i].className =
            "nav-button";

    }


    navigationButtons[currentPage].className =
        "nav-button active";


    /*
       Old Safari does not support the
       modern scrollIntoView options object.

       Simple scrollIntoView is supported.
    */

    try {

        navigationButtons[currentPage]
            .scrollIntoView(false);

    }

    catch (e) {

        /* Ignore old Safari errors */

    }

}


/* =========================================================
   TOUCH SWIPING
   ========================================================= */

document.addEventListener(
    "touchstart",
    function(e) {

        if (
            !e.touches ||
            !e.touches.length
        ) {
            return;
        }

        touchStartX =
            e.touches[0].clientX;

        touchStartY =
            e.touches[0].clientY;

    },
    false
);


document.addEventListener(
    "touchend",
    function(e) {

        if (
            !e.changedTouches ||
            !e.changedTouches.length
        ) {
            return;
        }

        var touchEndX =
            e.changedTouches[0].clientX;

        var touchEndY =
            e.changedTouches[0].clientY;

        var differenceX =
            touchStartX -
            touchEndX;

        var differenceY =
            touchStartY -
            touchEndY;


        if (
            Math.abs(differenceX) > 50 &&
            Math.abs(differenceX) >
            Math.abs(differenceY)
        ) {

            if (differenceX > 0) {

                goToPage(
                    currentPage + 1
                );

            }

            else {

                goToPage(
                    currentPage - 1
                );

            }

        }

    },
    false
);


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {

    var now = new Date();

    var hours =
        now.getHours();

    var minutes =
        now.getMinutes();


    var displayHours =
        hours % 12;


    if (displayHours === 0) {
        displayHours = 12;
    }


    var minuteText =
        minutes < 10
            ? "0" + minutes
            : minutes;


    var period =
        hours >= 12
            ? "PM"
            : "AM";


    document.getElementById(
        "time"
    ).innerHTML =

        displayHours +
        ":" +
        minuteText +
        " " +
        period;


    /*
       Manual date formatting.

       This avoids relying on newer
       Intl/date formatting behaviour.
    */

    var weekdays = [

        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"

    ];


    var months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];


    var dateText =

        weekdays[now.getDay()] +
        ", " +
        now.getDate() +
        " " +
        months[now.getMonth()];


    document.getElementById(
        "date"
    ).innerHTML = dateText;


    updateGreeting(hours);
}


/* =========================================================
   GREETING
   ========================================================= */

function updateGreeting(hours) {

    var greetings;


    if (
        hours >= 5 &&
        hours < 9
    ) {

        greetings = [

            "Good morning.",

            "Morning.",

            "Good morning! Ready for the day?",

            "Rise and shine.",

            "Morning. Let's get started."

        ];

    }


    else if (
        hours >= 9 &&
        hours < 18
    ) {

        greetings = [

            "Good afternoon.",

            "Hello.",

            "Hope you're having a good day.",

            "Good to see you.",

            "What are we doing today?"

        ];

    }


    else if (
        hours >= 18 &&
        hours < 21
    ) {

        greetings = [

            "Good evening.",

            "Evening.",

            "Hope you had a good day.",

            "Good evening. What's happening?",

            "Welcome back."

        ];

    }


    else {

        greetings = [

            "Good night.",

            "It's getting late.",

            "Still awake?",

            "Good night. Don't stay up too late.",

            "Late night mode activated."

        ];

    }


    var now =
        new Date();


    var index =

        (
            now.getDate() +
            now.getHours()
        )
        %
        greetings.length;


    document.getElementById(
        "greeting"
    ).innerHTML =

        greetings[index];
}


/* =========================================================
   WEATHER
   ========================================================= */

var GWELUP_LAT = -31.872;

var GWELUP_LON = 115.799;


/* =========================================================
   WEATHER DESCRIPTION
   ========================================================= */

function weatherDescription(code) {

    code = parseInt(code, 10);


    if (code === 0)
        return "Clear sky";


    if (code === 1)
        return "Mainly clear";


    if (code === 2)
        return "Partly cloudy";


    if (code === 3)
        return "Overcast";


    if (
        code === 45 ||
        code === 48
    )
        return "Fog";


    if (
        code >= 51 &&
        code <= 57
    )
        return "Drizzle";


    if (
        code >= 61 &&
        code <= 67
    )
        return "Rain";


    if (
        code >= 71 &&
        code <= 77
    )
        return "Snow";


    if (
        code >= 80 &&
        code <= 82
    )
        return "Rain showers";


    if (
        code >= 85 &&
        code <= 86
    )
        return "Snow showers";


    if (
        code >= 95 &&
        code <= 99
    )
        return "Thunderstorm";


    return "Unknown";
}


/* =========================================================
   FORMAT HOUR
   ========================================================= */

function formatHour(hourString) {

    /*
       Open-Meteo gives the time in local
       Perth time because timezone is specified.

       Instead of using new Date("YYYY-MM-DD HH:MM"),
       manually extract the hour.

       This is much safer on old Safari.
    */

    var parts =
        hourString.split("T");


    var timePart =
        parts.length > 1
            ? parts[1]
            : hourString;


    var hour =
        parseInt(
            timePart.substring(0, 2),
            10
        );


    var displayHour =
        hour % 12;


    if (displayHour === 0) {
        displayHour = 12;
    }


    var period =
        hour >= 12
            ? "PM"
            : "AM";


    return displayHour + " " + period;
}


/* =========================================================
   WEATHER HTTP REQUEST
   ========================================================= */

function loadWeather() {

    var url =

        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        GWELUP_LAT +

        "&longitude=" +
        GWELUP_LON +

        "&current=" +

        "temperature_2m," +
        "apparent_temperature," +
        "weather_code," +
        "wind_speed_10m" +

        "&hourly=" +

        "temperature_2m," +
        "precipitation_probability," +
        "weather_code" +

        "&daily=" +

        "temperature_2m_max," +
        "precipitation_probability_max," +
        "weather_code" +

        "&timezone=Australia%2FPerth" +

        "&forecast_days=7";


    /*
       IMPORTANT:
       iOS 9 Safari does NOT have fetch().

       XMLHttpRequest works on iOS 9.
    */

    var request =
        new XMLHttpRequest();


    request.open(
        "GET",
        url,
        true
    );


    request.onreadystatechange =
        function() {


            if (
                request.readyState !== 4
            ) {
                return;
            }


            if (
                request.status < 200 ||
                request.status >= 300
            ) {

                weatherError(
                    "Weather unavailable"
                );

                return;
            }


            var data;


            try {

                data =
                    JSON.parse(
                        request.responseText
                    );

            }

            catch (e) {

                weatherError(
                    "Weather data error"
                );

                return;
            }


            displayWeather(data);
        };


    request.onerror =
        function() {

            weatherError(
                "Weather unavailable"
            );

        };


    try {

        request.send(null);

    }

    catch (e) {

        weatherError(
            "Weather unavailable"
        );

    }

}


/* =========================================================
   WEATHER ERROR
   ========================================================= */

function weatherError(message) {

    document.getElementById(
        "homeWeather"
    ).innerHTML = message;


    document.getElementById(
        "weatherTemp"
    ).innerHTML = "--";


    document.getElementById(
        "weatherCondition"
    ).innerHTML = message;


    document.getElementById(
        "weatherFeels"
    ).innerHTML = "--";


    document.getElementById(
        "wind"
    ).innerHTML = "--";


    document.getElementById(
        "rainChance"
    ).innerHTML = "--";


    document.getElementById(
        "high"
    ).innerHTML = "--";


    document.getElementById(
        "hourlyWeather"
    ).innerHTML =
        "Unable to load forecast.";
}


/* =========================================================
   DISPLAY WEATHER
   ========================================================= */

function displayWeather(data) {

    if (
        !data ||
        !data.current ||
        !data.daily ||
        !data.hourly
    ) {

        weatherError(
            "Weather data unavailable"
        );

        return;
    }


    var current =
        data.current;

    var daily =
        data.daily;

    var hourly =
        data.hourly;


    /*
       CURRENT TEMPERATURE
    */

    var temperature =
        Math.round(
            parseFloat(
                current.temperature_2m
            )
        );


    var apparent =
        Math.round(
            parseFloat(
                current.apparent_temperature
            )
        );


    var windSpeed =
        Math.round(
            parseFloat(
                current.wind_speed_10m
            )
        );


    /*
       HOME
    */

    document.getElementById(
        "homeWeather"
    ).innerHTML =

        temperature +
        "°C · " +

        weatherDescription(
            current.weather_code
        );


    /*
       WEATHER PAGE
    */

    document.getElementById(
        "weatherTemp"
    ).innerHTML =

        temperature +
        "°C";


    document.getElementById(
        "weatherCondition"
    ).innerHTML =

        weatherDescription(
            current.weather_code
        );


    document.getElementById(
        "weatherFeels"
    ).innerHTML =

        "Feels like " +
        apparent +
        "°C";


    document.getElementById(
        "wind"
    ).innerHTML =

        windSpeed +
        " km/h";


    /*
       RAIN CHANCE
    */

    if (
        daily.precipitation_probability_max &&
        daily.precipitation_probability_max.length
    ) {

        document.getElementById(
            "rainChance"
        ).innerHTML =

            daily
                .precipitation_probability_max[0] +
            "%";

    }


    /*
       HIGH
    */

    if (
        daily.temperature_2m_max &&
        daily.temperature_2m_max.length
    ) {

        document.getElementById(
            "high"
        ).innerHTML =

            Math.round(
                parseFloat(
                    daily.temperature_2m_max[0]
                )
            ) +
            "°";

    }


    /*
       HOURLY FORECAST
    */

    var hourlyContainer =
        document.getElementById(
            "hourlyWeather"
        );


    hourlyContainer.innerHTML = "";


    /*
       Find the current hour based on
       the actual Perth-local hour.

       This avoids parsing the full
       date string with old Safari.
    */

    var now =
        new Date();

    var currentHour =
        now.getHours();


    var shown = 0;

    var i;


    for (
        i = 0;
        i < hourly.time.length &&
        shown < 8;
        i++
    ) {

        var timeString =
            hourly.time[i];


        /*
           Extract the hour from:
           YYYY-MM-DDTHH:MM
        */

        var timeParts =
            timeString.split("T");


        if (
            timeParts.length < 2
        ) {
            continue;
        }


        var hourNumber =
            parseInt(
                timeParts[1].substring(0, 2),
                10
            );


        /*
           Extract the date.

           Example:
           2026-08-17
        */

        var datePart =
            timeParts[0];


        var dateParts =
            datePart.split("-");


        if (
            dateParts.length < 3
        ) {
            continue;
        }


        var year =
            parseInt(
                dateParts[0],
                10
            );


        var month =
            parseInt(
                dateParts[1],
                10
            );


        var day =
            parseInt(
                dateParts[2],
                10
            );


        var hourDate =
            new Date(
                year,
                month - 1,
                day,
                hourNumber,
                0,
                0
            );


        /*
           Only show future/current hours.
        */

        if (
            hourDate.getTime() <
            now.getTime()
        ) {
            continue;
        }


        var item =
            document.createElement(
                "div"
            );


        item.className =
            "hour";


        var temp =
            Math.round(
                parseFloat(
                    hourly.temperature_2m[i]
                )
            );


        var rain =
            hourly.precipitation_probability[i];


        item.innerHTML =

            '<div class="hour-time">' +

            formatHour(
                timeString
            ) +

            '</div>' +

            '<div class="hour-temp">' +

            temp +

            '°</div>' +

            '<div class="hour-rain">' +

            rain +

            '% rain</div>';


        hourlyContainer
            .appendChild(item);


        shown++;
    }


    if (
        shown === 0
    ) {

        hourlyContainer.innerHTML =
            "No hourly forecast available.";

    }

}


/* =========================================================
   CALCULATOR
   ========================================================= */

var calcValue = "";

var calcOperator = "";

var calcFirstNumber = "";

var calcResetNext = false;


/* =========================================================
   CALCULATOR DISPLAY
   ========================================================= */

function updateCalcDisplay() {

    var display =
        document.getElementById(
            "calcDisplay"
        );


    if (
        calcValue === ""
    ) {

        display.innerHTML =
            "0";

    }

    else {

        display.innerHTML =
            calcValue;

    }
}


/* =========================================================
   NUMBER
   ========================================================= */

function inputNumber(number) {

    if (
        calcResetNext
    ) {

        calcValue = "";

        calcResetNext = false;

    }


    /*
       Don't allow an absurdly long
       number on the old iPad.
    */

    if (
        calcValue.length >= 15
    ) {

        return;

    }


    calcValue += number;


    updateCalcDisplay();
}


/* =========================================================
   DECIMAL
   ========================================================= */

function inputDecimal() {

    if (
        calcResetNext
    ) {

        calcValue = "";

        calcResetNext = false;

    }


    if (
        calcValue.indexOf(".") === -1
    ) {

        if (
            calcValue === ""
        ) {

            calcValue = "0";

        }


        calcValue += ".";

    }


    updateCalcDisplay();
}


/* =========================================================
   OPERATOR
   ========================================================= */

function inputOperator(operator) {

    if (
        calcValue === ""
    ) {

        return;

    }


    /*
       If the user presses another
       operator, replace the old one.
    */

    if (
        calcOperator !== "" &&
        calcResetNext
    ) {

        calcOperator =
            operator;

        return;

    }


    calcFirstNumber =
        parseFloat(
            calcValue
        );


    calcOperator =
        operator;


    calcResetNext =
        true;
}


/* =========================================================
   CALCULATE
   ========================================================= */

function calculate() {

    if (
        calcOperator === "" ||
        calcFirstNumber === "" ||
        calcValue === ""
    ) {

        return;

    }


    var secondNumber =
        parseFloat(
            calcValue
        );


    var result = 0;


    if (
        calcOperator === "+"
    ) {

        result =
            calcFirstNumber +
            secondNumber;

    }


    else if (
        calcOperator === "-"
    ) {

        result =
            calcFirstNumber -
            secondNumber;

    }


    else if (
        calcOperator === "*"
    ) {

        result =
            calcFirstNumber *
            secondNumber;

    }


    else if (
        calcOperator === "/"
    ) {

        if (
            secondNumber === 0
        ) {

            calcValue =
                "Error";

            calcOperator =
                "";

            calcFirstNumber =
                "";

            calcResetNext =
                true;

            updateCalcDisplay();

            return;
        }


        result =
            calcFirstNumber /
            secondNumber;

    }


    else if (
        calcOperator === "%"
    ) {

        result =
            calcFirstNumber %
            secondNumber;

    }


    /*
       Reduce floating point noise.
    */

    result =
        Math.round(
            result * 100000000
        ) /
        100000000;


    calcValue =
        String(result);


    calcOperator =
        "";

    calcFirstNumber =
        "";

    calcResetNext =
        true;


    updateCalcDisplay();
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearCalc() {

    calcValue = "";

    calcOperator = "";

    calcFirstNumber = "";

    calcResetNext = false;


    updateCalcDisplay();
}


/* =========================================================
   BACKSPACE
   ========================================================= */

function backspace() {

    if (
        calcResetNext
    ) {

        return;

    }


    calcValue =

        calcValue.substring(
            0,
            calcValue.length - 1
        );


    updateCalcDisplay();
}


/* =========================================================
   START
   ========================================================= */

updateClock();


setInterval(
    updateClock,
    1000
);


loadWeather();


/*
   Refresh weather every 10 minutes.
*/

setInterval(
    loadWeather,
    600000
);

</script>
