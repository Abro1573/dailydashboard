<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {

    -webkit-box-sizing: border-box;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101010;

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

}


button {

    font-family: inherit;

}


/* =========================================================
   APP
   ========================================================= */

#app {

    width: 100%;
    height: 100%;

    overflow: hidden;

}


/* =========================================================
   PAGES
   ========================================================= */

#pages {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    width: 400%;
    height: 100%;

    -webkit-transform: translateX(0);
    transform: translateX(0);

    -webkit-transition:
        -webkit-transform 0.35s ease;

    transition:
        transform 0.35s ease;

}


.page {

    width: 25%;
    height: 100%;

    -webkit-flex-shrink: 0;
    flex-shrink: 0;

    padding:
        35px
        25px
        90px
        25px;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

}


.page-content {

    width: 100%;

    max-width: 600px;

    margin: 0 auto;

}


/* =========================================================
   HOME
   ========================================================= */

#home {

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    -webkit-align-items: center;
    align-items: center;

    -webkit-justify-content: center;
    justify-content: center;

    text-align: center;

}


.home-inner {

    width: 100%;

}


.time {

    font-weight: 300;

}


.date {

}


.greeting {

}


.home-weather {

}


/* =========================================================
   GENERAL
   ========================================================= */

.card {

.divider {

    margin: 18px 0;

/* =========================================================
   WEATHER
   ========================================================= */

}


.weather-temp {

    font-size: 70px;

    font-weight: 300;

}


.weather-condition {

}


.weather-feels {

.weather-grid {

    overflow: hidden;

}

.stat-label {

}


.stat-value {

    font-size: 20px;

}


/* =========================================================

   ========================================================= */

.hour-row {

.calculator {

.calc-display {

    padding: 15px;

    text-align: right;

    font-size: 40px;

    line-height: 55px;

    overflow: hidden;

    white-space: nowrap;

}


/*
   OLD SAFARI SAFE CALCULATOR

   Four explicit columns.
*/

.calc-row {

    width: 100%;

    height: 65px;

    margin-bottom: 9px;

    overflow: hidden;

}


.calc-button {

    display: block;

    float: left;

    width: 23.5%;

    height: 65px;

    margin-right: 2%;

    padding: 0;

    border: none;

    border-radius: 14px;

    background: #242424;

    color: #ffffff;

    font-size: 24px;

    outline: none;

}


.calc-button:last-child {

    margin-right: 0;

}


.calc-button:active {

    background: #3a3a3a;

    -webkit-transform: scale(0.97);

    transform: scale(0.97);

}


.calc-button.operator {

    background: #303030;

}


.calc-button.clear {

    background: #333333;

}


/*
   The equals button occupies
   two normal button widths.
*/

.calc-button.equals {

    width: 49%;

    background: #ffffff;

    color: #111111;

}


/* =========================================================
   ASSISTANT
   ========================================================= */

.assistant {

    text-align: center;

    margin-top: 80px;

}


.assistant-circle {

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: #1c1c1c;

    margin:
        0
        auto
        30px
        auto;

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    -webkit-align-items: center;
    align-items: center;

    -webkit-justify-content: center;
    justify-content: center;

    font-size: 18px;

    color: #888888;

}


.assistant-text {

    font-size: 25px;

}


.assistant-sub {

    margin-top: 12px;

    color: #777777;

    font-size: 16px;

}


/* =========================================================
   NAVIGATION
   ========================================================= */

#navigation {

    position: fixed;

    bottom: 15px;

    left: 50%;

    -webkit-transform:
        translateX(-50%);

    transform:
        translateX(-50%);

    display: -webkit-box;
    display: -webkit-flex;
    display: flex;

    max-width:
        calc(100% - 30px);

    padding: 6px;

    background: #191919;

    border-radius: 14px;

    z-index: 10;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;

}


/*
   NO DOTS.
*/

.nav-button {

    -webkit-flex-shrink: 0;
    flex-shrink: 0;

    border: none;

    background: transparent;

    color: #777777;

        9px
        13px;

    border-radius: 10px;

}


.nav-button:active {

        scale(0.96);

}

}


/* =========================================================

   ========================================================= */

    }


    .calc-button {

        height: 60px;

        font-size: 22px;

    }


    .calc-row {

        height: 60px;

    }

}

</style>

</head>

<script>

/* =========================================================
   PAGE NAVIGATION
   ========================================================= */

var currentPage = 0;

var totalPages = 4;

var pages =
    document.getElementById("pages");

var navigationButtons =
    document.getElementsByClassName(
        "nav-button"
    );

var touchStartX = 0;

var touchStartY = 0;


function goToPage(page) {

    if (page < 0) {
        page = 0;
    }

    if (page >= totalPages) {
        page = totalPages - 1;
    }

    currentPage = page;

    updatePage();

}


function updatePage() {

    var amount =
        currentPage * 25;


    pages.style.webkitTransform =
        "translateX(-" +
        amount +
        "%)";


    pages.style.transform =
        "translateX(-" +
        amount +
        "%)";


    var i;


    for (
        i = 0;
        i < navigationButtons.length;
        i++
    ) {

        navigationButtons[i].className =
            "nav-button";

    }


    navigationButtons[currentPage].className =
        "nav-button active";

}


/* =========================================================
   SWIPING
   ========================================================= */

document.addEventListener(
    "touchstart",
    function(e) {

        if (
            !e.touches ||
            !e.touches.length
        ) {
            return;
        }


        touchStartX =
            e.touches[0].clientX;


        touchStartY =
            e.touches[0].clientY;

    },
    false
);


document.addEventListener(
    "touchend",
    function(e) {

        if (
            !e.changedTouches ||
            !e.changedTouches.length
        ) {
            return;
        }


        var touchEndX =
            e.changedTouches[0].clientX;


        var touchEndY =
            e.changedTouches[0].clientY;


        var differenceX =
            touchStartX -
            touchEndX;


        var differenceY =
            touchStartY -
            touchEndY;


        if (
            Math.abs(differenceX) > 50 &&
            Math.abs(differenceX) >
            Math.abs(differenceY)
        ) {

            if (
                differenceX > 0
            ) {

                goToPage(
                    currentPage + 1
                );

            }

            else {

                goToPage(
                    currentPage - 1
                );

            }

        }

    },
    false
);


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {

    var now =
        new Date();


    var hours =
        now.getHours();


    var minutes =
        now.getMinutes();


    var displayHours =
        hours % 12;


    if (
        displayHours === 0
    ) {

        displayHours = 12;

    }


    var minuteText =
        minutes < 10
            ? "0" + minutes
            : minutes;


    var period =
        hours >= 12
            ? "PM"
            : "AM";


    document.getElementById(
        "time"
    ).innerHTML =

        displayHours +
        ":" +
        minuteText +
        " " +
        period;


    var weekdays = [

        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"

    ];


    var months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];


    document.getElementById(
        "date"
    ).innerHTML =

        weekdays[now.getDay()] +
        ", " +
        now.getDate() +
        " " +
        months[now.getMonth()];


    updateGreeting(hours);

}


/* =========================================================
   GREETING
   ========================================================= */

function updateGreeting(hours) {

    var greetings;


    if (
        hours >= 5 &&
        hours < 9
    ) {

        greetings = [

            "Good morning.",

            "Morning.",

            "Good morning! Ready for the day?",

            "Rise and shine.",

            "Morning. Let's get started."

        ];

    }


    else if (
        hours >= 9 &&
        hours < 18
    ) {

        greetings = [

            "Good afternoon.",

            "Hello.",

            "Hope you're having a good day.",

            "Good to see you.",

            "What are we doing today?"

        ];

    }


    else if (
        hours >= 18 &&
        hours < 21
    ) {

        greetings = [

            "Good evening.",

            "Evening.",

            "Hope you had a good day.",

            "Good evening. What's happening?",

            "Welcome back."

        ];

    }


    else {

        greetings = [

            "Good night.",

            "It's getting late.",

            "Still awake?",

            "Good night. Don't stay up too late.",

            "Late night mode activated."

        ];

    }


    var now =
        new Date();


    var index =

        (
            now.getDate() +
            now.getHours()
        )
        %
        greetings.length;


    document.getElementById(
        "greeting"
    ).innerHTML =

        greetings[index];

}


/* =========================================================
   WEATHER
   ========================================================= */

var GWELUP_LAT =
    -31.872;


var GWELUP_LON =
    115.799;


/* =========================================================
   WEATHER DESCRIPTION
   ========================================================= */

function weatherDescription(code) {

    code =
        parseInt(
            code,
            10
        );


    if (code === 0)
        return "Clear sky";


    if (code === 1)
        return "Mainly clear";


    if (code === 2)
        return "Partly cloudy";


    if (code === 3)
        return "Overcast";


    if (
        code === 45 ||
        code === 48
    )
        return "Fog";


    if (
        code >= 51 &&
        code <= 57
    )
        return "Drizzle";


    if (
        code >= 61 &&
        code <= 67
    )
        return "Rain";


    if (
        code >= 71 &&
        code <= 77
    )
        return "Snow";


    if (
        code >= 80 &&
        code <= 82
    )
        return "Rain showers";


    if (
        code >= 85 &&
        code <= 86
    )
        return "Snow showers";


    if (
        code >= 95 &&
        code <= 99
    )
        return "Thunderstorm";


    return "Unknown";

}


/* =========================================================
   FORMAT WEATHER HOUR
   ========================================================= */

function formatHour(timeString) {

    var parts =
        timeString.split("T");


    if (
        parts.length < 2
    ) {

        return "--";

    }


    var hour =
        parseInt(
            parts[1].substring(0, 2),
            10
        );


    var displayHour =
        hour % 12;


    if (
        displayHour === 0
    ) {

        displayHour = 12;

    }


    return (

        displayHour +
        " " +
        (
            hour >= 12
                ? "PM"
                : "AM"
        )

    );

}


/* =========================================================
   WEATHER ERROR
   ========================================================= */

function weatherError(message) {

    document.getElementById(
        "homeWeather"
    ).innerHTML =
        message;


    document.getElementById(
        "weatherTemp"
    ).innerHTML =
        "--";


    document.getElementById(
        "weatherCondition"
    ).innerHTML =
        message;


    document.getElementById(
        "weatherFeels"
    ).innerHTML =
        "--";


    document.getElementById(
        "wind"
    ).innerHTML =
        "--";


    document.getElementById(
        "rainChance"
    ).innerHTML =
        "--";


    document.getElementById(
        "high"
    ).innerHTML =
        "--";


    document.getElementById(
        "hourlyWeather"
    ).innerHTML =
        "Unable to load forecast.";

}


/* =========================================================
   DISPLAY WEATHER
   ========================================================= */

function displayWeather(data) {

    if (
        !data ||
        !data.current ||
        !data.daily ||
        !data.hourly
    ) {

        weatherError(
            "Invalid weather data"
        );

        return;

    }


    var current =
        data.current;


    var daily =
        data.daily;


    var hourly =
        data.hourly;


    var temperature =
        Math.round(
            parseFloat(
                current.temperature_2m
            )
        );


    var apparent =
        Math.round(
            parseFloat(
                current.apparent_temperature
            )
        );


    var wind =
        Math.round(
            parseFloat(
                current.wind_speed_10m
            )
        );


    document.getElementById(
        "homeWeather"
    ).innerHTML =

        temperature +
        "°C · " +

        weatherDescription(
            current.weather_code
        );


    document.getElementById(
        "weatherTemp"
    ).innerHTML =

        temperature +
        "°C";


    document.getElementById(
        "weatherCondition"
    ).innerHTML =

        weatherDescription(
            current.weather_code
        );


    document.getElementById(
        "weatherFeels"
    ).innerHTML =

        "Feels like " +
        apparent +
        "°C";


    document.getElementById(
        "wind"
    ).innerHTML =

        wind +
        " km/h";


    if (
        daily.precipitation_probability_max
    ) {

        document.getElementById(
            "rainChance"
        ).innerHTML =

            daily
                .precipitation_probability_max[0] +
            "%";

    }


    if (
        daily.temperature_2m_max
    ) {

        document.getElementById(
            "high"
        ).innerHTML =

            Math.round(
                parseFloat(
                    daily.temperature_2m_max[0]
                )
            ) +
            "°";

    }


    var container =
        document.getElementById(
            "hourlyWeather"
        );


    container.innerHTML =
        "";


    var now =
        new Date();


    var shown = 0;

    var i;


    for (
        i = 0;
        i < hourly.time.length &&
        shown < 8;
        i++
    ) {

        var timeString =
            hourly.time[i];


        var parts =
            timeString.split("T");


        if (
            parts.length < 2
        ) {

            continue;

        }


        var dateParts =
            parts[0].split("-");


        var timeParts =
            parts[1].split(":");


        if (
            dateParts.length < 3 ||
            timeParts.length < 2
        ) {

            continue;

        }


        var forecastDate =
            new Date(
                parseInt(dateParts[0], 10),
                parseInt(dateParts[1], 10) - 1,
                parseInt(dateParts[2], 10),
                parseInt(timeParts[0], 10),
                parseInt(timeParts[1], 10),
                0
            );


        if (
            forecastDate.getTime() <
            now.getTime()
        ) {

            continue;

        }


        var item =
            document.createElement(
                "div"
            );


        item.className =
            "hour";


        item.innerHTML =

            '<div class="hour-time">' +

            formatHour(
                timeString
            ) +

            '</div>' +

            '<div class="hour-temp">' +

            Math.round(
                parseFloat(
                    hourly.temperature_2m[i]
                )
            ) +

            '°</div>' +

            '<div class="hour-rain">' +

            hourly
                .precipitation_probability[i] +

            '% rain</div>';


        container.appendChild(
            item
        );


        shown++;

    }


    if (
        shown === 0
    ) {

        container.innerHTML =
            "No hourly forecast available.";

    }

}


/* =========================================================
   LOAD WEATHER
   ========================================================= */

function loadWeather() {

    /*
       If opened directly from Files,
       the old Safari security model may
       block this request.

       We deliberately show a useful error
       rather than leaving "Loading..."
       forever.
    */

    if (
        window.location.protocol ===
        "file:"
    ) {

        weatherError(
            "Open through HTTPS for weather"
        );

        return;

    }


    var url =

        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        GWELUP_LAT +

        "&longitude=" +
        GWELUP_LON +

        "&current=" +

        "temperature_2m," +
        "apparent_temperature," +
        "weather_code," +
        "wind_speed_10m" +

        "&hourly=" +

        "temperature_2m," +
        "precipitation_probability," +
        "weather_code" +

        "&daily=" +

        "temperature_2m_max," +
        "precipitation_probability_max," +
        "weather_code" +

        "&timezone=Australia%2FPerth" +

        "&forecast_days=7";


    var request =
        new XMLHttpRequest();


    request.open(
        "GET",
        url,
        true
    );


    request.onreadystatechange =
        function() {

            if (
                request.readyState !== 4
            ) {

                return;

            }


            if (
                request.status < 200 ||
                request.status >= 300
            ) {

                weatherError(
                    "Weather connection failed"
                );

                return;

            }


            var data;


            try {

                data =
                    JSON.parse(
                        request.responseText
                    );

            }

            catch (e) {

                weatherError(
                    "Weather data error"
                );

                return;

            }


            displayWeather(
                data
            );

        };


    request.onerror =
        function() {

            weatherError(
                "Weather connection failed"
            );

        };


    request.ontimeout =
        function() {

            weatherError(
                "Weather request timed out"
            );

        };


    try {

        request.send(null);

    }

    catch (e) {

        weatherError(
            "Weather request blocked"
        );

    }

}


/* =========================================================
   CALCULATOR
   ========================================================= */

var calcValue = "";

var calcOperator = "";

var calcFirstNumber = "";

var calcResetNext = false;


function updateCalcDisplay() {

    var display =
        document.getElementById(
            "calcDisplay"
        );


    if (
        calcValue === ""
    ) {

        display.innerHTML =
            "0";

    }

    else {

        display.innerHTML =
            calcValue;

    }

}


function inputNumber(number) {

    if (
        calcResetNext
    ) {

        calcValue =
            "";

        calcResetNext =
            false;

    }


    if (
        calcValue.length >= 15
    ) {

        return;

    }


    calcValue +=
        number;


    updateCalcDisplay();

}


function inputDecimal() {

    if (
        calcResetNext
    ) {

        calcValue =
            "";

        calcResetNext =
            false;

    }


    if (
        calcValue.indexOf(".") === -1
    ) {

        if (
            calcValue === ""
        ) {

            calcValue =
                "0";

        }


        calcValue +=
            ".";

    }


    updateCalcDisplay();

}


function inputOperator(operator) {

    if (
        calcValue === ""
    ) {

        return;

    }


    if (
        calcOperator !== "" &&
        calcResetNext
    ) {

        calcOperator =
            operator;

        return;

    }


    calcFirstNumber =
        parseFloat(
            calcValue
        );


    calcOperator =
        operator;


    calcResetNext =
        true;

}


function calculate() {

    if (
        calcOperator === "" ||
        calcFirstNumber === "" ||
        calcValue === ""
    ) {

        return;

    }


    var secondNumber =
        parseFloat(
            calcValue
        );


    var result =
        0;


    if (
        calcOperator === "+"
    ) {

        result =
            calcFirstNumber +
            secondNumber;

    }


    else if (
        calcOperator === "-"
    ) {

        result =
            calcFirstNumber -
            secondNumber;

    }


    else if (
        calcOperator === "*"
    ) {

        result =
            calcFirstNumber *
            secondNumber;

    }


    else if (
        calcOperator === "/"
    ) {

        if (
            secondNumber === 0
        ) {

            calcValue =
                "Error";

            calcOperator =
                "";

            calcFirstNumber =
                "";

            calcResetNext =
                true;

            updateCalcDisplay();

            return;

        }


        result =
            calcFirstNumber /
            secondNumber;

    }


    else if (
        calcOperator === "%"
    ) {

        result =
            calcFirstNumber %
            secondNumber;

    }


    result =

        Math.round(
            result *
            100000000
        )
        /
        100000000;


    calcValue =
        String(result);


    calcOperator =
        "";

    calcFirstNumber =
        "";

    calcResetNext =
        true;


    updateCalcDisplay();

}


function clearCalc() {

    calcValue =
        "";

    calcOperator =
        "";

    calcFirstNumber =
        "";

    calcResetNext =
        false;


    updateCalcDisplay();

}


function backspace() {

    if (
        calcResetNext
    ) {

        return;

    }


    calcValue =

        calcValue.substring(
            0,
            calcValue.length - 1
        );


    updateCalcDisplay();

}


/* =========================================================
   START
   ========================================================= */

updateClock();


setInterval(
    updateClock,
    1000
);


loadWeather();


setInterval(
    loadWeather,
    600000
);
